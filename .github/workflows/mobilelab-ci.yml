name: MobileLab — tests

on:
  push:
    paths: ["mobilelab/**", ".github/workflows/mobilelab-ci.yml"]
  pull_request:
    paths: ["mobilelab/**", ".github/workflows/mobilelab-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    defaults:
      run:
        working-directory: mobilelab
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliothèques Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libgl1
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest
