[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilelab"
version = "0.1.0"
description = "Boîte à outils desktop open source pour appareils mobiles : détection, sauvegarde et analyse de données légitimement accessibles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MobileLab contributors" }]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
build = ["pyinstaller>=6.6"]

[project.scripts]
mobilelab = "mobilelab.app:main"
mobilelab-cli = "mobilelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobilelab = ["ui/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "UP042"]  # str+Enum : sérialisation explicite

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"src/mobilelab/ui/theme.py" = ["E501"]  # feuille de style Qt
